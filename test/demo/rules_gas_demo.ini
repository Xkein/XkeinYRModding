; ============================================
; FireAura Demo - GAS 测试配置
; 使用方法：将本文件内容合并到游戏目录下的
; F:\GAME\YR\Yuri's Revenge\modify\rules_sub.ini
; 放到 ; TEST GAS 区块中
; ============================================

; ---- FireAura Demo 配置 ----

; 属性集定义：SP / OP 两个属性
; Note: HP is already in AttributeSet_Test, so only SP and OP are added here.
[AttributeSet_FireAura]
AttributeSetCreator = me/FireAura.js
Attributes = SP, OP

; 火焰光环能力
; - 激活时获得 Buff.FireAura 标签
; - 消耗 SP（通过 CostGameplayEffectClass）
[Ability_FireAura]
AbilityCreator = me/FireAura.js
ActivationOwnedTags = Buff.FireAura
CostGameplayEffectClass = Effect_FireAuraCost

; 消耗效果：Instant，扣 15 SP
[Effect_FireAuraCost]
DurationPolicy = Instant
Modifiers = Mod_FireAuraCost_SP

[Mod_FireAuraCost_SP]
Attribute = AttributeSet_FireAura.SP
ModifierOp = AddBase
ModifierMagnitude.MagnitudeCalculationType = ScalableFloat
ModifierMagnitude.ScalableFloatMagnitude = -15

; 燃烧持续伤害效果（DOT）
; - 持续时间 8 秒（由 BurnDOTDuration 定义）
; - 每 1 秒执行一次周期伤害
; - 每次 -5 HP
; - 授予 Debuff.Burning 标签
; Note: GameplayCues cannot be loaded from INI (GameplayEffectCue is not IniComponent,
;   see gas.md §15.4). The burning cue is triggered manually in FireAura.ts via
;   asc.ExecuteGameplayCue(tag, params). Define [GameplayCue.Fire.Burning] separately
;   if you need the cue notify to respond.
[Effect_BurningDOT]
DurationPolicy = HasDuration
DurationMagnitude = BurnDOTDuration
Period = 1.0
bExecutePeriodicEffectOnApplication = true
Modifiers = Mod_BurningDOT_HP
GEComponents = BurningDOT_TargetTags

; 持续时间数值：8 秒
[BurnDOTDuration]
MagnitudeCalculationType = ScalableFloat
ScalableFloatMagnitude = 8

[Mod_BurningDOT_HP]
Attribute = AttributeSet_Test.HP
ModifierOp = AddBase
ModifierMagnitude.MagnitudeCalculationType = ScalableFloat
ModifierMagnitude.ScalableFloatMagnitude = -5

; 标签组件：对目标授予 Debuff.Burning 标签
[BurningDOT_TargetTags]
$Type = TargetTagsGEComponent
GrantedTags = Debuff.Burning

; ============================================
; HTK 配置 - 追加到原有的 GAS 配置后面
; 原有配置保留不变，追加 FireAura 的属性和能力
; ============================================
[HTK]
; 保留原有的 AttributeSet_Test，追加 AttributeSet_FireAura
ASC.Attributes = AttributeSet_Test, AttributeSet_FireAura
; 保留原有的 Ability_GoodBuff，追加 Ability_FireAura
ASC.DefaultAbilities = Ability_GoodBuff, Ability_FireAura
; 保留原有的启动标签
ASC.StartupTags = HTKTag

; ============================================
; Script Registration
;
; [JsScriptList] loads the script globally (creates GameScriptable).
; This is required for savegame lifecycle: without it, onLoad()/onSave()
; are never called, and per-object associations (addInst/removeInst) are
; not saved/restored.
;
; Additionally, add "JsScripts = me/FireAura.js" to each unit type section
; that should trigger FireAura on fire. Example:
;
;   [SomeInfantryType]
;   JsScripts = me/FireAura.js
;
; Without JsScripts on the type, IsInstanceOfScriptable() always returns
; false and the ability is never activated.
; ============================================
[JsScriptList]
FireAura = me/FireAura.js

; ============================================
; GAS Behavioral Verification Test Effects
; Used by FireAura.ts GASBehavioralTests to
; verify 4 recently implemented GAS features:
;   1. Default values (bExecutePeriodicEffectOnApplication=true)
;   2. bExecutePeriodicEffectOnApplication immediate-first-tick
;   3. PeriodicInhibitionPolicy (NeverReset/ResetPeriod/ExecuteAndResetPeriod)
;   4. bRequireModifierSuccessToTriggerCues gating
;
; Note on GameplayCues: GameplayEffectCue is not IniComponent/IniAutoLoad and
;   cannot be loaded from INI (gas.md §15.4). Cue triggering for tests 4 should
;   be done via [GameplayCue.XXX] definitions + GameplayCueTag mechanism, or
;   triggered manually in script. The GameplayCues lines have been removed.
; ============================================

; Test 1: bExecutePeriodicEffectOnApplication=true (default)
; Effect executes immediately on application, then every Period seconds.
[Effect_Test_ImmediatePeriodic]
DurationPolicy = HasDuration
DurationMagnitude = TestDuration100
Period = 10.0
bExecutePeriodicEffectOnApplication = true
Modifiers = Mod_Test_ImmediatePeriodic_HP

[TestDuration100]
MagnitudeCalculationType = ScalableFloat
ScalableFloatMagnitude = 100.0

[Mod_Test_ImmediatePeriodic_HP]
Attribute = AttributeSet_Test.HP
ModifierOp = AddBase
ModifierMagnitude.MagnitudeCalculationType = ScalableFloat
ModifierMagnitude.ScalableFloatMagnitude = -1

; Test 2: bExecutePeriodicEffectOnApplication=false
; Effect does NOT execute on application; first execution occurs after Period elapses.
[Effect_Test_DelayedPeriodic]
DurationPolicy = HasDuration
DurationMagnitude = TestDuration100
Period = 10.0
bExecutePeriodicEffectOnApplication = false
Modifiers = Mod_Test_DelayedPeriodic_HP

[Mod_Test_DelayedPeriodic_HP]
Attribute = AttributeSet_Test.HP
ModifierOp = AddBase
ModifierMagnitude.MagnitudeCalculationType = ScalableFloat
ModifierMagnitude.ScalableFloatMagnitude = -1

; Test 3: PeriodicInhibitionPolicy=NeverReset (default)
; On inhibit-resume, period timer continues unaffected.
[Effect_Test_InhibitNeverReset]
DurationPolicy = HasDuration
DurationMagnitude = TestDuration100
Period = 5.0
bExecutePeriodicEffectOnApplication = false
PeriodicInhibitionPolicy = NeverReset
Modifiers = Mod_Test_InhibitNeverReset_HP

[Mod_Test_InhibitNeverReset_HP]
Attribute = AttributeSet_Test.HP
ModifierOp = AddBase
ModifierMagnitude.MagnitudeCalculationType = ScalableFloat
ModifierMagnitude.ScalableFloatMagnitude = -1

; Test 4: PeriodicInhibitionPolicy=ResetPeriod
; On inhibit-resume, period timer resets; next execution occurs one full period later.
[Effect_Test_InhibitReset]
DurationPolicy = HasDuration
DurationMagnitude = TestDuration100
Period = 5.0
bExecutePeriodicEffectOnApplication = false
PeriodicInhibitionPolicy = ResetPeriod
Modifiers = Mod_Test_InhibitReset_HP

[Mod_Test_InhibitReset_HP]
Attribute = AttributeSet_Test.HP
ModifierOp = AddBase
ModifierMagnitude.MagnitudeCalculationType = ScalableFloat
ModifierMagnitude.ScalableFloatMagnitude = -1

; Test 5: PeriodicInhibitionPolicy=ExecuteAndResetPeriod
; On inhibit-resume, executes once immediately AND resets the period timer.
[Effect_Test_InhibitExecuteReset]
DurationPolicy = HasDuration
DurationMagnitude = TestDuration100
Period = 5.0
bExecutePeriodicEffectOnApplication = false
PeriodicInhibitionPolicy = ExecuteAndResetPeriod
Modifiers = Mod_Test_InhibitExecuteReset_HP

[Mod_Test_InhibitExecuteReset_HP]
Attribute = AttributeSet_Test.HP
ModifierOp = AddBase
ModifierMagnitude.MagnitudeCalculationType = ScalableFloat
ModifierMagnitude.ScalableFloatMagnitude = -1

; Test 6: bRequireModifierSuccessToTriggerCues=true (default)
; GameplayCues fire ONLY when all modifiers execute successfully.
; Note: GameplayCues field removed — not loadable from INI (gas.md §15.4).
; To test cue gating, trigger cues manually via asc.ExecuteGameplayCue() in script,
; or define [GameplayCue.Test.CueGated] and use the GameplayCueTag mechanism.
[Effect_Test_CueGated]
DurationPolicy = Instant
bRequireModifierSuccessToTriggerCues = true
Modifiers = Mod_Test_CueGated_HP

[Mod_Test_CueGated_HP]
Attribute = AttributeSet_Test.HP
ModifierOp = AddBase
ModifierMagnitude.MagnitudeCalculationType = ScalableFloat
ModifierMagnitude.ScalableFloatMagnitude = 5

; Test 7: bRequireModifierSuccessToTriggerCues=false
; GameplayCues fire regardless of modifier success/failure.
; Note: GameplayCues field removed — not loadable from INI (gas.md §15.4).
; To test cue gating, trigger cues manually via asc.ExecuteGameplayCue() in script,
; or define [GameplayCue.Test.CueUnGated] and use the GameplayCueTag mechanism.
[Effect_Test_CueUnGated]
DurationPolicy = Instant
bRequireModifierSuccessToTriggerCues = false
Modifiers = Mod_Test_CueUnGated_HP

[Mod_Test_CueUnGated_HP]
Attribute = AttributeSet_Test.HP
ModifierOp = AddBase
ModifierMagnitude.MagnitudeCalculationType = ScalableFloat
ModifierMagnitude.ScalableFloatMagnitude = 5
